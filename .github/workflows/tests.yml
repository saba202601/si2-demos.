name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: si2
          POSTGRES_DB: si2
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SI2_TEST_PG_URL: postgresql://postgres:si2@localhost:5432/si2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          pip install -r requirements.txt pytest reportlab
      - name: Unit and engine tests
        run: python -m pytest tests iso_bureau/tests -q --ignore=tests/test_apps_smoke.py
      - name: Every app and every step renders
        run: python -m pytest tests/test_apps_smoke.py -q
      - name: One-million-row benchmark (smaller book in CI)
        run: python -m benchmarks.initial_load_benchmark --policies 20000
